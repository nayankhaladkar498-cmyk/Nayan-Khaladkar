<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- E Letter Gradient: Sunset Gold to Warm Orange to Coral -->
    <linearGradient id="gradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- S Letter Gradient: Magenta to Violet to Deep Indigo -->
    <linearGradient id="gradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Bridge Arch Gradient: Soft White to Shimmer Pink -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Smooth Rounded Corners -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />
  
  <!-- Subtle Glowing Backdrop -->
  <circle cx="250" cy="200" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Fireworks / Celebration Sparks above the S -->
  <g id="fireworks" transform="translate(340, 110)">
    <!-- Central star -->
    <polygon points="0,-24 7,-8 24,-7 11,5 15,22 0,11 -15,22 -11,5 -24,-7 -7,-8" fill="#fbbf24" />
    <!-- Pink star -->
    <polygon points="26,-10 30,0 40,1 32,7 34,17 26,10 18,17 20,7 12,1 22,0" fill="#ec4899" transform="scale(0.65)" />
    <!-- Purple star -->
    <polygon points="-30,-8 -26,2 -16,3 -24,9 -22,19 -30,12 -38,19 -36,9 -44,3 -34,2" fill="#c084fc" transform="scale(0.55)" />
    <!-- Light trails -->
    <path d="M -8, 28 Q -2, 6 0, -20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 12, 30 Q 18, 14 26, -5" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M -22, 34 Q -26, 18 -32, 2" stroke="#a855f7" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- LOGO EMBLEM: E and S Combined Shapes with Bridge -->
  <g id="main-symbol" transform="translate(30, 20)">
    <!-- 'E' Structure -->
    <path d="M 110, 130 
             C 110, 105 130, 85 155, 85 
             L 245, 85 
             C 265, 85 275, 100 270, 115 
             C 265, 130 250, 135 235, 135 
             L 170, 135 
             L 170, 175 
             L 225, 175 
             C 245, 175 250, 190 245, 205 
             C 240, 218 225, 222 210, 222 
             L 170, 222 
             L 170, 260 
             L 240, 260 
             C 260, 260 268, 275 260, 290 
             C 252, 302 238, 305 220, 305 
             L 155, 305 
             C 130, 305 110, 285 110, 260 Z" 
          fill="url(#gradE)" />

    <!-- 'S' Structure -->
    <path d="M 335, 110 
             C 385, 110 405, 140 395, 175 
             C 385, 210 340, 230 305, 240 
             C 285, 246 270, 252 270, 265 
             C 270, 278 285, 288 308, 288 
             C 335, 288 360, 275 375, 260 
             C 385, 250 398, 254 402, 266 
             C 406, 278 398, 292 382, 306 
             C 358, 326 325, 335 295, 335 
             C 245, 335 220, 305 225, 265 
             C 230, 225 280, 205 315, 192 
             C 338, 184 350, 174 350, 160 
             C 350, 145 336, 138 318, 138 
             C 292, 138 270, 150 252, 165 
             C 242, 174 230, 170 226, 158 
             C 222, 146 230, 132 248, 118 
             C 272, 102 305, 110 335, 110 Z" 
          fill="url(#gradS)" />

    <!-- Bridge Arch (Setu) spanning between E and S -->
    <path d="M 125, 295 
             Q 240, 170 375, 235 
             Q 240, 195 135, 305 Z" 
          fill="url(#bridgeGrad)" opacity="0.95" />

    <!-- People Silhouette Under the Arch (Celebrating Event Community) -->
    <g id="people" fill="#ffffff" opacity="0.92">
      <!-- Center Person -->
      <circle cx="240" cy="245" r="11" />
      <path d="M 224, 295 C 224, 270 256, 270 256, 295 Z" />
      <!-- Left Person -->
      <circle cx="205" cy="254" r="8.5" />
      <path d="M 193, 295 C 193, 275 217, 275 217, 295 Z" />
      <!-- Right Person -->
      <circle cx="275" cy="254" r="8.5" />
      <path d="M 263, 295 C 263, 275 287, 275 287, 295 Z" />
    </g>
  </g>

  <!-- BRAND NAME: EVENTSETU -->
  <text x="250" y="380" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="1">
    <tspan fill="#ffffff">EVENT</tspan><tspan fill="url(#textGrad)">SETU</tspan>
  </text>

  <!-- TAGLINE: CONNECT | BOOK | CELEBRATE -->
  <g transform="translate(250, 412)">
    <!-- Left Accent Line -->
    <line x1="-165" y1="-5" x2="-130" y2="-5" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <!-- Center Tagline Text -->
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          fill="#cbd5e1" 
          letter-spacing="3.5">
      CONNECT <tspan fill="#ec4899">|</tspan> BOOK <tspan fill="#ec4899">|</tspan> CELEBRATE
    </text>
    <!-- Right Accent Line -->
    <line x1="130" y1="-5" x2="165" y2="-5" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
